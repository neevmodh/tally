<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tally</title>
  <meta name="description" content="Talk to your electricity bill in Gujarati, Hindi or English.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg">
  <meta name="theme-color" content="#0b1514">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <header class="top">
    <div class="brand"><img src="icon.svg" alt="" width="32" height="32"><span>Tally</span><small>talk to your bill</small></div>
    <div class="langs" role="group" aria-label="Language">
      <button data-lang="en" class="on">EN</button>
      <button data-lang="hi">हिं</button>
      <button data-lang="gu">ગુ</button>
    </div>
  </header>

  <div id="layout">
    <section class="stage" id="stage" aria-label="Voice">
      <button id="mic" class="orbbtn" aria-label="Tap to talk">
        <canvas id="orb" width="480" height="480"></canvas>
        <span id="orbhint">Tap to talk</span>
      </button>
      <p id="say" class="say" aria-live="polite">Talk to your <em>bill</em>.</p>
      <p id="you" class="you" aria-live="polite"></p>
      <ol id="steps" class="steps" hidden><li>Units</li><li>Last month</li><li>Amount</li><li>Confirm</li><li>Usage</li><li>Dashboard</li></ol>
      <div id="choices" class="choices"></div>
      <div id="hints" class="hints" hidden></div>
      <p id="status" class="status"></p>
    </section>

    <section id="panels" class="panels" aria-label="Dashboard"></section>
  </div>

  <details id="logbox" class="logbox"><summary>Transcript</summary><ol id="log"></ol></details>

  <form id="textform" class="dock">
    <input id="textin" placeholder="Or type your answer" autocomplete="off" aria-label="Type your answer">
    <button type="submit" aria-label="Send">➤</button>
  </form>

  <script src="i18n.js"></script>
  <script src="numbers.js"></script>
  <script src="tariff.js"></script>
  <script src="sim.js"></script>
  <script src="viz.js"></script>
  <script src="app.js"></script>
</body>
</html>
